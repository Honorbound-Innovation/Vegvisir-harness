# Vegvisir first-class component manifest.
# This manifest records source components vendored into the monorepo. Runtime
# installers should build/materialize executable artifacts under ~/.vegvisir/tools.
#
# External runtime policy:
# - Ghidra itself is not vendored in this repository.
# - Vegvisir integrates with a separately installed Ghidra distribution through
#   GHIDRA_HOME, GHIDRA_HEADLESS, or PATH discovery.
# - Installers must not fetch, clone, update, or build upstream Ghidra source.

[components.solarium]
name = "Solarium"
ownership = "first-party"
license = "MIT (Vegvisir)"
kind = "node"
path = "components/solarium"
source_snapshot = "/mnt/storage/Vegvisir-Projects/Solarium"
install_root = "~/.vegvisir/tools/src/Solarium"
wrapper = "solarium"
excluded = [".git", "node_modules", "dist", ".solarium", ".vegvisir"]

[external.ghidra]
name = "Ghidra"
ownership = "third-party"
license = "Apache-2.0"
kind = "installed-runtime"
required_for = ["components/ghidra-headless-mcp"]
discovery = ["GHIDRA_HOME", "GHIDRA_HEADLESS", "PATH:analyzeHeadless", "PATH:ghidraRun"]
wrappers = ["ghidra", "analyzeHeadless"]
upstream_auto_update = false
installer_policy = "discover installed runtime only; never fetch, clone, update, or build upstream Ghidra source"

[components.ghidra_headless_mcp]
name = "GhidraHeadlessMCP"
ownership = "first-party"
license = "MIT (Vegvisir)"
kind = "python-mcp"
path = "components/ghidra-headless-mcp"
source_snapshot = "/mnt/storage/Vegvisir-Projects/GhidraHeadlessMCP"
runtime_root = "~/.vegvisir/tools/src/GhidraHeadlessMCP"
wrappers = ["ghidra-headless", "ghidra-headless-mcp"]
mcp_servers = ["ghidra-headless"]
requires_external_runtime = "Ghidra"
excluded = []

[components.binary_intelligence_workbench]
name = "Binary Intelligence Workbench"
ownership = "first-party"
license = "MIT (Vegvisir)"
kind = "python"
path = "components/binary-intelligence-workbench"
source_snapshot = "/mnt/storage/Vegvisir-Projects/binary-intelligence-workbench"
runtime_root = "~/.vegvisir/tools/src/binary-intelligence-workbench"
wrappers = ["biw"]
excluded = [".git", "__pycache__", "*.pyc", ".pytest_cache", ".vegvisir"]

[components.msp]
name = "Model Skill Protocol"
ownership = "first-party"
license = "MIT (MSP)"
kind = "rust"
path = "components/msp"
source_snapshot = "/mnt/storage/Projects/MSP"
runtime_root = "~/.vegvisir/tools/src/MSP"
wrappers = ["msp-cli", "msp-server"]
integration = "vendored local-first protocol/reference crates used by components/msp-client"
excluded = [".git", "target", "Cargo.lock", ".vegvisir"]

[components.msp_client]
name = "Vegvisir MSP Client"
ownership = "first-party"
license = "MIT (Vegvisir)"
kind = "rust"
path = "components/msp-client"
source_snapshot = "native Vegvisir component"
runtime_root = "~/.vegvisir/tools/src/msp-client"
wrappers = ["vegvisir msp", "msp-client"]
depends_on = ["components.msp"]
provides_tools = ["msp_client_info", "msp_client_search", "msp_client_load", "msp_client_manifest", "msp_client_verify_trust", "msp_client_check_compatibility"]
integration = "native Vegvisir component client for local MSP registries; no MCP transport required"
excluded = ["target", ".vegvisir"]
