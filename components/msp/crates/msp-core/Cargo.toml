[package]
name = "msp-core"
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/Honorbound-Innovation/MSP"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc", "rand_core"] }
hex = "0.4"
jsonschema = { version = "0.46", default-features = false }
once_cell = "1.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
rand = "0.8"
